# ==============================================================
#  Notificación por correo del reporte
#  email.mode = SMTP      -> envío real
#  email.mode = SIMULATED -> genera target/email-outbox/*.eml
# ==============================================================
email.enabled=true
email.mode=SIMULATED
email.smtp.host=${SMTP_HOST:localhost}
email.smtp.port=${SMTP_PORT:1025}
email.smtp.auth=false
email.smtp.starttls=false
email.smtp.ssl=false
email.username=${SMTP_USERNAME:}
email.password=${SMTP_PASSWORD:}
email.from=${EMAIL_FROM:qa-automation@example.com}
email.to=${EMAIL_TO:qa-team@example.com}
email.cc=
email.subject=[API Tests] restful-api.dev
email.report.dir=target/allure-report
email.results.dir=target/allure-results
email.outbox.dir=target/email-outbox
email.fail.on.error=false
