# Entorno QA autenticado: colecciones privadas con x-api-key (100 peticiones/día)
# Uso: -Denv=qa-auth y variable de entorno API_KEY
auth.types=API_KEY
endpoint.objects=/collections/${API_COLLECTION:qa-automation}/objects
endpoint.object.by.id=/collections/${API_COLLECTION:qa-automation}/objects/{id}
