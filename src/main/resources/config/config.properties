# ==============================================================
#  Configuración base. Cualquier clave se puede sobrescribir con
#  -Dclave=valor o con la variable de entorno CLAVE_EN_MAYUSCULAS
# ==============================================================
base.url=https://api.restful-api.dev

# --- HTTP ---
http.connect.timeout.ms=10000
http.read.timeout.ms=15000
http.retry.max.attempts=2
http.retry.backoff.ms=1500

# --- SLA ---
sla.response.time.ms=3000

# --- Autenticación dinámica ---
# Lista separada por comas: NONE | API_KEY | BEARER | OAUTH2   (API_KEY debe ir antes de BEARER si se combinan)
auth.types=NONE
auth.apikey.name=x-api-key
auth.apikey.value=${API_KEY:}
auth.apikey.location=HEADER
# Bearer estático; si está vacío se obtiene un JWT dinámico vía /login con las credenciales
auth.bearer.token=${API_BEARER_TOKEN:}
auth.bearer.login.email=${API_LOGIN_EMAIL:}
auth.bearer.login.password=${API_LOGIN_PASSWORD:}
auth.bearer.query.params=auth-type=jwt
# OAuth2 client_credentials
auth.oauth2.token.url=${OAUTH2_TOKEN_URL:}
auth.oauth2.client.id=${OAUTH2_CLIENT_ID:}
auth.oauth2.client.secret=${OAUTH2_CLIENT_SECRET:}
auth.oauth2.scope=${OAUTH2_SCOPE:}

# --- Validaciones ---
validation.required.headers=Content-Type,Date
validation.name.max.length=100
validation.year.min=1970
# Diferencia máxima permitida entre createdAt/updatedAt y la hora local (desfase de reloj)
validation.timestamp.tolerance.minutes=10

# --- Datos de prueba ---
testdata.file=testdata/objects.json

# --- Logs y reintentos de TestNG ---
log.file=target/logs/api-tests.log
log.mask.headers=Authorization,x-api-key,Cookie,Set-Cookie
test.retry.max=1
